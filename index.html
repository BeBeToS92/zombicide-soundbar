<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1412">
  <title>Zombicide Soundbar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Zombicide Soundbar</h1>
    <div class="controls">
      <label class="volume">
        <span aria-hidden="true">🔊</span>
        <input id="master-volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Master volume">
      </label>
      <button id="stop-all" class="stop-all" type="button">Stop all</button>
    </div>
  </header>

  <main id="board"></main>

  <footer class="hint">
    Tap a button to play it. Ambient sounds loop until you tap them again.
    <span class="desktop-only">Keyboard shortcuts are shown in the corner of each button.</span>
  </footer>

  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
